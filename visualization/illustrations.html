<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Illustrated construction · ver503</title><link rel="stylesheet" href="assets/reading.css"></head><body><header><strong>SMOOTH TIGHT NONRIGIDITY</strong><nav><a href="index.html">3D atlas</a><a href="guide.html">Guide</a><a href="illustrations.html">Figures</a><a href="../paper/paper.pdf">Paper</a></nav></header><main style="margin-left:0;max-width:1250px;margin-right:auto;margin-left:auto;"><h1>Illustrated construction · ver503</h1><p class="lead">Six illustrated explanations from ver503. Open the PDF link below a figure for its vector original.</p><div class="figure-grid"><figure><a href="../paper/figures/01-band.pdf"><img loading="lazy" src="figures/01-band.png" alt="The spatial band and its local geometry"></a><figcaption><strong>The spatial band and its local geometry</strong><br>The global view locates the actual thin band. The local view uses a rigid rotation and uniform magnification to reveal the rulings and the protected region; global and local panels have distinct scales. <a href="../paper/figures/01-band.pdf">Vector PDF</a></figcaption></figure><figure><a href="../paper/figures/02-alternative-bands.pdf"><img loading="lazy" src="figures/02-alternative-bands.png" alt="Other bands with the same return mechanism"></a><figcaption><strong>Other bands with the same return mechanism</strong><br>Three-, four- and five-lobed closed tracks illustrate the same identity-return mechanism. Straight rulings and curved members of the other asymptotic family are distinguished. These broad immersions may self-intersect and are separate from the torus completion. <a href="../paper/figures/02-alternative-bands.pdf">Vector PDF</a></figcaption></figure><figure><a href="../paper/figures/03-seeds.pdf"><img loading="lazy" src="figures/03-seeds.png" alt="Spatial seeds and their spherical data"></a><figcaption><strong>Spatial seeds and their spherical data</strong><br>The seed and frame generate the principal-normal ruled surface. The figures compare the drawable spatial center and the corresponding spherical data used to build it. <a href="../paper/figures/03-seeds.pdf">Vector PDF</a></figcaption></figure><figure><a href="../paper/figures/04-bending-map.pdf"><img loading="lazy" src="figures/04-bending-map.png" alt="A bending supported along closed asymptotic leaves"></a><figcaption><strong>A bending supported along closed asymptotic leaves</strong><br>This explanatory sketch follows the first integral along the non-ruling asymptotic family. A compact profile selects whole closed leaves; its derivatives determine the supported infinitesimal bending. Opposite signs then give exactly equal induced metrics under the zero-strain equation. <a href="../paper/figures/04-bending-map.pdf">Vector PDF</a></figcaption></figure><figure><a href="../paper/figures/05-completion.pdf"><img loading="lazy" src="figures/05-completion.png" alt="From protected band to a closed surface"></a><figcaption><strong>From protected band to a closed surface</strong><br>The construction schematic traces positive exits, visible connectors, dual quadratic fillings, the radial neck, reflection and convex closure. It describes the intended smooth construction; saved 3D completion meshes still require internal relative smoothing. <a href="../paper/figures/05-completion.pdf">Vector PDF</a></figcaption></figure><figure><a href="../paper/figures/06-cantor-family.pdf"><img loading="lazy" src="figures/06-cantor-family.png" alt="Independent signs on disjoint supports"></a><figcaption><strong>Independent signs on disjoint supports</strong><br>This sketch shows how disjoint supported fields and rapidly decaying amplitudes encode sign sequences. The paper discusses the Cantor-family construction; the current Lean project defers that extension and has not certified the full family. <a href="../paper/figures/06-cantor-family.pdf">Vector PDF</a></figcaption></figure></div></main></body></html>
